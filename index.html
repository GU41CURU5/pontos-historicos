<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pontos Históricos · 4ª Bda C Mec (Guaicurus)</title>

  <!-- Leaflet (CDN; funciona ao abrir o arquivo direto e no GitHub Pages) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app">

    <header class="topo">
      <button class="hamburguer" id="btn-hamburguer" title="Abrir menu" aria-label="Abrir menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="brasao-wrap">
        <span class="brasao-fallback">4ª</span>
        <img class="brasao" src="assets/logo/brasao-4bdacmec.png" alt="Brasão da 4ª Brigada de Cavalaria Mecanizada"
             onerror="this.style.display='none'">
      </div>
      <div>
        <h1>Pontos Históricos</h1>
        <div class="sub">4ª Brigada de Cavalaria Mecanizada &middot; Guaicurus</div>
      </div>
      <div class="direita">
        <div class="contador">Pontos no mapa: <b id="contador-total">0</b></div>
      </div>
    </header>

    <div class="fundo-lateral" id="fundo-lateral"></div>

    <aside class="lateral" id="lateral">
      <div class="filtros">
        <p class="rotulo-secao">Buscar</p>
        <input type="text" id="busca" class="busca" placeholder="Nome, cidade, período, palavra-chave…">
        <p class="rotulo-secao">Unidade</p>
        <div class="unidades" id="unidades"><!-- gerado por app.js --></div>
        <p class="rotulo-secao">Categoria</p>
        <select id="filtro-categoria" class="filtro-categoria"><!-- gerado por app.js --></select>
      </div>

      <div class="lista" id="lista"><!-- gerado por app.js --></div>

      <div class="rodape-lateral">
        <details>
          <summary>Links úteis</summary>
          <ul id="links-uteis"><!-- gerado por app.js --></ul>
        </details>
      </div>
    </aside>

    <main class="mapa">
      <div id="mapa"></div>
      <button class="btn-enquadrar" id="btn-enquadrar" title="Ajustar o mapa aos pontos visíveis">Enquadrar tudo</button>

      <div class="legenda">
        <p class="rotulo-secao">Legenda</p>
        <div class="corpo-legenda"><!-- gerado por app.js --></div>
      </div>

      <!-- dossiê (somente leitura) -->
      <section class="detalhe" aria-label="Dossiê do ponto">
        <div class="cabecalho">
          <span class="faixa-unidade"></span>
          <button class="fechar" title="Fechar">&times;</button>
          <h2></h2>
          <div class="local"></div>
        </div>
        <div class="corpo">
          <ul class="ficha"></ul>
          <p class="rotulo-secao-detalhe">Fotos</p>
          <div class="galeria"></div>
          <p class="rotulo-secao-detalhe">Descrição</p>
          <p class="descricao"></p>
          <div class="bloco-links"></div>
          <p class="fontes"></p>
        </div>
      </section>
    </main>

  </div>

  <footer class="rodape-site">
    <p>Comunicação Social &middot; 4ª Brigada de Cavalaria Mecanizada &mdash; contato:
      <a href="mailto:4bdacmec@gmail.com">4bdacmec@gmail.com</a>
    </p>
  </footer>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-fechar" id="lightbox-fechar" title="Fechar" aria-label="Fechar">&times;</button>
    <img src="" alt="Foto ampliada">
  </div>

  <!-- configuração + dados por unidade + lógica (a ordem importa) -->
  <script src="js/dados/config.js"></script>
  <script src="js/dados/pontos-3bia-aaae.js"></script>
  <script src="js/dados/pontos-10rc-mec.js"></script>
  <script src="js/dados/pontos-11rc-mec.js"></script>
  <script src="js/dados/pontos-17rc-mec.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
